name: Build Standalone Windows (.exe)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Standalone Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Mathematical Solver Unit Tests
        run: npm test

      - name: Build Standalone Windows (.exe)
        run: npm run build:win

      - name: Package Release ZIP
        shell: bash
        run: |
          mkdir -p release-output
          cp dist-electron/*.exe release-output/ || true
          cd release-output
          tar -a -c -f ../ProjectionFX-Windows-x64.zip *
          cd ..
          ls -lh ProjectionFX-Windows-x64.zip

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ProjectionFX-Windows-x64
          path: ProjectionFX-Windows-x64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            ProjectionFX-Windows-x64.zip
            dist-electron/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
